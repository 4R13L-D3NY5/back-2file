# Nginx CORS Configuration for api.documentacion.xpertiaplus.com
# Add this to your server block in /etc/nginx/sites-available/api.documentacion.xpertiaplus.com

server {
    listen 443 ssl http2;
    server_name api.documentacion.xpertiaplus.com;
    
    # SSL configuration (update with your cert paths)
    ssl_certificate /etc/letsencrypt/live/api.documentacion.xpertiaplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.documentacion.xpertiaplus.com/privkey.pem;
    
    root /var/www/api.documentacion.xpertiaplus.com/public;
    index index.php;
    
    # CORS headers for all responses
    add_header 'Access-Control-Allow-Origin' 'https://documentacion.xpertiaplus.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-XSRF-TOKEN, X-CSRF-TOKEN, Accept, Origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age' 86400 always;
    
    # Handle OPTIONS preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # CORS headers for PHP responses too
        add_header 'Access-Control-Allow-Origin' 'https://documentacion.xpertiaplus.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-XSRF-TOKEN, X-CSRF-TOKEN, Accept, Origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
    
    location ~ /\.ht {
        deny all;
    }
}